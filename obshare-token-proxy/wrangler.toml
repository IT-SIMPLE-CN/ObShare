name = "obshare-token-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 非敏感配置在这里

# 敏感配置使用 secrets（部署时通过命令行设置）:
# wrangler secret put FEISHU_APP_ID
# wrangler secret put FEISHU_APP_SECRET
# wrangler secret put API_KEY

# KV 命名空间配置
# 首先创建 KV 命名空间：wrangler kv:namespace create TOKEN_CACHE
# 然后将返回的 id 填入下方
[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "cbf6a1c9f1ca47e0865ec53d9a74949b"
# preview_id = "<your-preview-kv-namespace-id>"  # 可选，用于本地开发
